# Self-host IMAP MCP: app + Postgres, with Caddy in front for HTTPS.
#
#   cp .env.example .env    # fill in the values (see README: "Self-host with Docker")
#   docker compose up -d
#
# The app is not published on any host port: it's reachable only through Caddy,
# which sets the real client IP (X-Forwarded-For) that the login rate limit relies on.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imap_mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: imap_mcp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imap_mcp -d imap_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://imap_mcp:${POSTGRES_PASSWORD}@db:5432/imap_mcp
      APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
      # The app checks tokens against its own signing keys; fetch them inside the container.
      INTERNAL_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
